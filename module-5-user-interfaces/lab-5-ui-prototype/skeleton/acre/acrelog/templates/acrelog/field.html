<!DOCTYPE html>
<html>
<head>
    <title>ACRE Worklog</title>
</head>

<body>
    <div>
        <h2>Worklog for field {{ field.name }}</h2>
        <ul>
        {% for operation in operations %}
            <li>{{ operation }}</li>
        {% empty %}
            <li>No operations recorded for this field.</li>
        {% endfor %}
        </ul>
    </div>
    <h3><a href="/acrelog/">Back</a></h3>
</body>
</html>
